services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php-prod
    image: myorg/laravel-app:prod
    container_name: laravel_app
    restart: always
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS_ON_BOOT: ${RUN_MIGRATIONS_ON_BOOT:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    working_dir: /var/www/html
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - mysql
    networks:
      - webnet

  nginx:
    image: nginx:stable-alpine
    container_name: laravel_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/conf.d/ssl:/etc/nginx/ssl:ro  # optional for TLS certs
    depends_on:
      - app
    networks:
      - webnet

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: always
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webnet

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php-prod
    image: myorg/laravel-worker:prod
    container_name: laravel_worker
    restart: always
    env_file: ${APP_ENV_FILE:-.env.production}
    working_dir: /var/www/html
    volumes:
      - storage:/var/www/html/storage
    command: sh -c "php artisan queue:work --sleep=3 --tries=3"
    depends_on:
      - mysql
    networks:
      - webnet

volumes:
  mysql_data:
  storage:

networks:
  webnet:
    driver: bridge
