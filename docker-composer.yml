version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php-prod
    image: myorg/laravel-app:dev
    container_name: laravel_app_dev
    restart: always
    env_file: .env.docker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - storage:/var/www/html/storage
      - vendor:/var/www/html/vendor
      - ./storage/logs:/var/www/html/storage/logs
      - ./.env.docker:/var/www/html/.env:ro
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - mysql
    networks:
      - webnet

  nginx:
    image: nginx:stable-alpine
    container_name: laravel_nginx_dev
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webnet

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql_dev
    restart: always
    env_file: .env.docker
    environment:
      MYSQL_DATABASE: msu_eva
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webnet

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php-prod
    image: myorg/laravel-worker:dev
    container_name: laravel_worker_dev
    restart: always
    env_file: .env.docker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - ./.env.docker:/var/www/html/.env:ro
    command: sh -c "php artisan queue:work --sleep=3 --tries=3"
    depends_on:
      - mysql
    networks:
      - webnet

volumes:
  mysql_data:
  storage:
  vendor:

networks:
  webnet:
    driver: bridge
